#VRML_SIM R2025a utf8

PROTO Bottle [

  field SFVec3f translation 0 0 0
  field SFRotation rotation 0 1 0 0
  field SFString name "Bottle"
  field SFColor color 0.1 0.5 1

]
{
  Solid {

    translation IS translation
    rotation IS rotation
    name IS name

    children [
      Shape {
        appearance Appearance {
          material Material {
            diffuseColor IS color
          }
        }

        geometry Cylinder {
          radius 0.030
          height 0.15
        }
      }
    ]

    boundingObject Cylinder {
      radius 0.030
      height 0.15
    }

    physics Physics {
      density 50
    }
  }
}